<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>기억력 게임</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;

    padding: 35px 20px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Noto Sans KR",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 10% 20%,
            #e4f8ed 0,
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 80%,
            #e8e7ff 0,
            transparent 30%
        ),
        #f7f8fc;

    color: #222;

    overflow-x: hidden;
}


/* =========================
   전체
========================= */

.wrap {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
}


/* =========================
   메인으로
========================= */

.home-btn {
    display: inline-flex;
    align-items: center;

    margin-bottom: 25px;
    padding: 9px 14px;

    background: #fff;

    border: 1px solid #e2e8f0;
    border-radius: 30px;

    color: #64748b;

    text-decoration: none;

    font-size: 14px;
    font-weight: 700;

    transition: .2s;
}

.home-btn:hover {
    background: #ecfdf5;

    border-color: #a7f3d0;

    color: #059669;

    transform: translateX(-2px);
}


/* =========================
   제목
========================= */

.header {
    text-align: center;
    margin-bottom: 28px;
}

.main-icon {
    width: 72px;
    height: 72px;

    margin: 0 auto 16px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 22px;

    background: #e4f8ed;

    font-size: 36px;
}

h1 {
    margin-bottom: 10px;

    font-size: 36px;
    letter-spacing: -1.5px;
}

.header p {
    color: #777;

    font-size: 15px;
    line-height: 1.7;
}


/* =========================
   게임 박스
========================= */

.game-box {
    padding: 30px;

    background: rgba(255,255,255,.95);

    border: 1px solid #e8e8ef;
    border-radius: 26px;

    box-shadow:
        0 18px 50px
        rgba(0,0,0,.06);
}


/* =========================
   게임 정보
========================= */

.game-info {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    margin-bottom: 25px;
}

.info-box {
    padding: 14px 8px;

    background: #f8fafc;

    border-radius: 14px;

    text-align: center;
}

.info-label {
    display: block;

    margin-bottom: 5px;

    color: #94a3b8;

    font-size: 11px;
}

.info-value {
    color: #334155;

    font-size: 18px;
    font-weight: 800;
}


/* =========================
   안내 메시지
========================= */

.message {
    min-height: 24px;

    margin-bottom: 20px;

    color: #059669;

    text-align: center;

    font-size: 14px;
    font-weight: 700;
}


/* =========================
   카드 영역
========================= */

.cards {
    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 12px;

    width: 100%;
}


/* =========================
   카드

   중요:
   실제 카드 영역에서만
   클릭되도록 수정
========================= */

.card {
    position: relative;

    display: block;

    width: 100%;

    aspect-ratio: 1 / 1;

    padding: 0;
    margin: 0;

    border: 0;
    border-radius: 17px;

    background: transparent;

    cursor: pointer;

    perspective: 800px;

    overflow: hidden;

    appearance: none;
    -webkit-appearance: none;

    touch-action: manipulation;
}


/* 카드 안쪽 */

.card-inner {
    position: relative;

    width: 100%;
    height: 100%;

    transform-style: preserve-3d;

    transition:
        transform .45s
        cubic-bezier(.4,.2,.2,1);

    /*
    클릭 이벤트는
    부모 .card만 받음
    */
    pointer-events: none;
}


/* 카드 뒤집기 */

.card.flipped .card-inner,
.card.matched .card-inner {
    transform: rotateY(180deg);
}


/* 카드 앞/뒤 */

.card-face {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius: 17px;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    pointer-events: none;
}


/* =========================
   카드 뒷면
========================= */

.card-back {
    background:
        linear-gradient(
            135deg,
            #10b981,
            #14b8a6
        );

    box-shadow:
        0 6px 16px
        rgba(16,185,129,.16);

    color: white;
}

.card-back::after {
    content: "?";

    width: 42px;
    height: 42px;

    display: flex;

    justify-content: center;
    align-items: center;

    border:
        2px solid
        rgba(255,255,255,.5);

    border-radius: 50%;

    font-size: 22px;
    font-weight: 800;
}


/* =========================
   카드 앞면
========================= */

.card-front {
    background: white;

    border:
        2px solid #d1fae5;

    transform:
        rotateY(180deg);

    font-size:
        clamp(30px, 7vw, 48px);

    box-shadow:
        0 6px 18px
        rgba(0,0,0,.07);
}


/* =========================
   맞춘 카드
========================= */

.card.matched .card-front {
    background: #ecfdf5;

    border-color: #6ee7b7;

    animation:
        matchPop .45s ease;
}


@keyframes matchPop {

    0% {
        transform:
            rotateY(180deg)
            scale(.85);
    }

    60% {
        transform:
            rotateY(180deg)
            scale(1.08);
    }

    100% {
        transform:
            rotateY(180deg)
            scale(1);
    }

}


/* =========================
   다시 시작
========================= */

.controls {
    margin-top: 25px;
}

.restart-btn {
    width: 100%;

    padding: 15px;

    border: 0;
    border-radius: 14px;

    background: #10b981;

    color: white;

    font-family: inherit;

    font-size: 15px;
    font-weight: 800;

    cursor: pointer;

    transition: .2s;
}

.restart-btn:hover {
    background: #059669;

    transform: translateY(-1px);
}


/* =========================
   완료 화면
========================= */

.complete {
    display: none;

    padding: 35px 20px;

    text-align: center;
}

.complete-icon {
    margin-bottom: 10px;

    font-size: 68px;
}

.complete h2 {
    margin-bottom: 10px;

    font-size: 30px;
}

.complete-text {
    margin-bottom: 25px;

    color: #64748b;

    line-height: 1.8;
}

.complete-score {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    margin-bottom: 25px;
}

.complete-score-box {
    padding: 18px 10px;

    background: #f0fdf4;

    border-radius: 15px;
}

.complete-score-label {
    display: block;

    margin-bottom: 5px;

    color: #64748b;

    font-size: 12px;
}

.complete-score-value {
    color: #059669;

    font-size: 23px;
    font-weight: 900;
}

.complete-buttons {
    display: grid;
    gap: 10px;
}

.play-again-btn,
.complete-home-btn {
    width: 100%;

    min-height: 52px;

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius: 14px;

    font-family: inherit;

    font-size: 15px;
    font-weight: 800;

    text-decoration: none;
}

.play-again-btn {
    border: 0;

    background: #10b981;

    color: white;

    cursor: pointer;
}

.complete-home-btn {
    background: #f8fafc;

    border:
        2px solid #e2e8f0;

    color: #475569;
}


/* =========================
   색종이
========================= */

#confettiCanvas {
    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 9999;
}


/* =========================
   모바일
========================= */

@media(max-width: 600px) {

    body {
        padding: 25px 14px;
    }

    h1 {
        font-size: 29px;
    }

    .game-box {
        padding: 20px 15px;

        border-radius: 21px;
    }

    .cards {
        gap: 8px;
    }

    .card,
    .card-face {
        border-radius: 13px;
    }

    .card-back::after {
        width: 34px;
        height: 34px;

        font-size: 18px;
    }

    .game-info {
        gap: 7px;
    }

    .info-value {
        font-size: 16px;
    }

}

</style>
</head>


<body>


<!-- 축하 효과 -->

<canvas id="confettiCanvas"></canvas>



<main class="wrap">


    <!-- =========================
         메인으로
    ========================== -->

    <a
        href="../"
        class="home-btn"
    >
        ← 메인으로
    </a>



    <!-- =========================
         제목
    ========================== -->

    <header class="header">


        <div class="main-icon">
            🃏
        </div>


        <h1>
            기억력 게임
        </h1>


        <p>
            같은 그림의 카드 두 장을 찾아보세요.<br>
            카드의 위치를 얼마나 잘 기억할 수 있을까요?
        </p>


    </header>



    <!-- =========================
         게임 화면
    ========================== -->

    <section
        class="game-box"
        id="gameBox"
    >


        <!-- 게임 정보 -->

        <div class="game-info">


            <div class="info-box">

                <span class="info-label">
                    시도 횟수
                </span>

                <span
                    class="info-value"
                    id="attemptCount"
                >
                    0
                </span>

            </div>



            <div class="info-box">

                <span class="info-label">
                    맞춘 카드
                </span>

                <span
                    class="info-value"
                    id="matchCount"
                >
                    0 / 8
                </span>

            </div>



            <div class="info-box">

                <span class="info-label">
                    플레이 시간
                </span>

                <span
                    class="info-value"
                    id="timeCount"
                >
                    00:00
                </span>

            </div>


        </div>



        <!-- 안내 -->

        <div
            class="message"
            id="message"
        >
            카드 위치를 기억하세요!
        </div>



        <!-- 카드 -->

        <div
            class="cards"
            id="cards"
        >
        </div>



        <!-- 다시 시작 -->

        <div class="controls">

            <button
                type="button"
                class="restart-btn"
                id="restartBtn"
            >
                🔄 게임 다시 시작
            </button>

        </div>


    </section>



    <!-- =========================
         완료 화면
    ========================== -->

    <section
        class="game-box complete"
        id="completeScreen"
    >


        <div class="complete-icon">
            🏆
        </div>


        <h2>
            성공!
        </h2>


        <div class="complete-text">
            모든 카드의 짝을 찾았어요!<br>
            기억력이 정말 좋네요.
        </div>



        <div class="complete-score">


            <div class="complete-score-box">

                <span class="complete-score-label">
                    총 시도
                </span>

                <span
                    class="complete-score-value"
                    id="finalAttempts"
                >
                    0회
                </span>

            </div>



            <div class="complete-score-box">

                <span class="complete-score-label">
                    걸린 시간
                </span>

                <span
                    class="complete-score-value"
                    id="finalTime"
                >
                    00:00
                </span>

            </div>


        </div>



        <div class="complete-buttons">


            <button
                type="button"
                class="play-again-btn"
                id="playAgainBtn"
            >
                🔄 다시 도전하기
            </button>


            <a
                href="../"
                class="complete-home-btn"
            >
                🏠 메인으로 가기
            </a>


        </div>


    </section>


</main>



<script>

/* =====================================
   카드 그림
===================================== */

const cardImages = [

    "🍎",
    "🍋",
    "🍇",
    "🍉",
    "🍓",
    "🥝",
    "🍑",
    "🍒"

];



/* =====================================
   변수
===================================== */

let firstCard = null;

let secondCard = null;

let lockBoard = true;

let attempts = 0;

let matches = 0;

let seconds = 0;

let timer = null;



/* =====================================
   요소
===================================== */

const cardsEl =
    document.getElementById(
        "cards"
    );


const messageEl =
    document.getElementById(
        "message"
    );


const attemptCountEl =
    document.getElementById(
        "attemptCount"
    );


const matchCountEl =
    document.getElementById(
        "matchCount"
    );


const timeCountEl =
    document.getElementById(
        "timeCount"
    );


const gameBox =
    document.getElementById(
        "gameBox"
    );


const completeScreen =
    document.getElementById(
        "completeScreen"
    );



/* =====================================
   배열 섞기
===================================== */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]

        ] = [

            array[j],
            array[i]

        ];

    }


    return array;

}



/* =====================================
   게임 만들기
===================================== */

function createGame() {


    clearInterval(timer);


    firstCard = null;

    secondCard = null;

    lockBoard = true;

    attempts = 0;

    matches = 0;

    seconds = 0;


    attemptCountEl.textContent =
        "0";


    matchCountEl.textContent =
        "0 / 8";


    timeCountEl.textContent =
        "00:00";


    messageEl.textContent =
        "카드 위치를 기억하세요!";


    gameBox.style.display =
        "block";


    completeScreen.style.display =
        "none";


    cardsEl.innerHTML =
        "";


    /*
    카드 두 세트 생성
    */

    const deck =
        shuffle([
            ...cardImages,
            ...cardImages
        ]);



    /*
    카드 만들기
    */

    deck.forEach(
        (image, index) => {


            const card =
                document.createElement(
                    "button"
                );


            card.type =
                "button";


            card.className =
                "card flipped";


            card.dataset.image =
                image;


            card.dataset.index =
                index;


            card.setAttribute(
                "aria-label",
                "기억력 게임 카드"
            );


            card.innerHTML = `

                <span class="card-inner">

                    <span
                        class="card-face card-back"
                    >
                    </span>

                    <span
                        class="card-face card-front"
                    >
                        ${image}
                    </span>

                </span>

            `;


            /*
            클릭은 반드시
            .card 버튼 자체에만 연결
            */

            card.addEventListener(
                "click",
                function () {

                    flipCard(this);

                }
            );


            cardsEl.appendChild(
                card
            );

        }
    );



    /*
    처음 2초 동안
    카드 전체 보여주기
    */

    setTimeout(
        () => {


            document
                .querySelectorAll(
                    ".card"
                )
                .forEach(
                    card => {


                        card.classList.remove(
                            "flipped"
                        );


                    }
                );


            lockBoard =
                false;


            messageEl.textContent =
                "같은 그림의 카드 두 장을 찾아보세요!";


            startTimer();


        },
        2000
    );

}



/* =====================================
   타이머
===================================== */

function startTimer() {


    clearInterval(timer);


    timer =
        setInterval(
            () => {


                seconds++;


                timeCountEl.textContent =
                    formatTime(
                        seconds
                    );


            },
            1000
        );

}



function formatTime(
    totalSeconds
) {


    const minutes =
        Math.floor(
            totalSeconds /
            60
        );


    const secs =
        totalSeconds %
        60;


    return (

        String(minutes)
            .padStart(
                2,
                "0"
            )

        +

        ":"

        +

        String(secs)
            .padStart(
                2,
                "0"
            )

    );

}



/* =====================================
   카드 클릭
===================================== */

function flipCard(card) {


    /*
    다른 카드 처리 중이면
    클릭 차단
    */

    if (lockBoard) {

        return;

    }


    /*
    이미 첫 번째로 선택한
    같은 카드라면 무시
    */

    if (
        card ===
        firstCard
    ) {

        return;

    }


    /*
    이미 맞춘 카드라면
    다시 클릭되지 않음
    */

    if (
        card.classList.contains(
            "matched"
        )
    ) {

        return;

    }


    /*
    카드 열기
    */

    card.classList.add(
        "flipped"
    );



    /*
    첫 번째 카드
    */

    if (!firstCard) {


        firstCard =
            card;


        return;

    }



    /*
    두 번째 카드
    */

    secondCard =
        card;


    /*
    두 장이 선택되면
    바로 추가 클릭 차단
    */

    lockBoard =
        true;


    attempts++;


    attemptCountEl.textContent =
        attempts;


    checkMatch();

}



/* =====================================
   카드 비교
===================================== */

function checkMatch() {


    const isMatch =

        firstCard.dataset.image ===
        secondCard.dataset.image;


    if (isMatch) {

        matchedCards();

    }

    else {

        unmatchedCards();

    }

}



/* =====================================
   같은 카드
===================================== */

function matchedCards() {


    firstCard.classList.add(
        "matched"
    );


    secondCard.classList.add(
        "matched"
    );


    matches++;


    matchCountEl.textContent =
        `${matches} / ${cardImages.length}`;


    messageEl.textContent =
        "🎉 맞았어요!";


    /*
    선택 초기화
    */

    firstCard = null;

    secondCard = null;


    /*
    모두 찾았다면 완료
    */

    if (
        matches ===
        cardImages.length
    ) {


        setTimeout(
            finishGame,
            600
        );


        return;

    }


    /*
    다음 카드 선택 가능
    */

    setTimeout(
        () => {


            lockBoard =
                false;


            messageEl.textContent =
                "같은 그림의 카드 두 장을 찾아보세요!";


        },
        450
    );

}



/* =====================================
   다른 카드
===================================== */

function unmatchedCards() {


    messageEl.textContent =
        "조금 더 기억해볼까요?";


    const card1 =
        firstCard;


    const card2 =
        secondCard;


    setTimeout(
        () => {


            card1.classList.remove(
                "flipped"
            );


            card2.classList.remove(
                "flipped"
            );


            firstCard =
                null;


            secondCard =
                null;


            lockBoard =
                false;


            messageEl.textContent =
                "같은 그림의 카드 두 장을 찾아보세요!";


        },
        850
    );

}



/* =====================================
   게임 완료
===================================== */

function finishGame() {


    clearInterval(timer);


    lockBoard =
        true;


    gameBox.style.display =
        "none";


    completeScreen.style.display =
        "block";


    document
        .getElementById(
            "finalAttempts"
        )
        .textContent =
            `${attempts}회`;


    document
        .getElementById(
            "finalTime"
        )
        .textContent =
            formatTime(
                seconds
            );


    launchConfetti(
        220
    );


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}



/* =====================================
   다시 시작
===================================== */

document
    .getElementById(
        "restartBtn"
    )
    .addEventListener(
        "click",
        createGame
    );


document
    .getElementById(
        "playAgainBtn"
    )
    .addEventListener(
        "click",
        createGame
    );



/* =====================================
   색종이 효과
===================================== */

const confettiCanvas =
    document.getElementById(
        "confettiCanvas"
    );


const ctx =
    confettiCanvas.getContext(
        "2d"
    );


let confettiPieces =
    [];


let confettiAnimation =
    null;


const confettiColors = [

    "#10b981",
    "#14b8a6",
    "#6366f1",
    "#8b5cf6",
    "#ec4899",
    "#f59e0b",
    "#3b82f6",
    "#facc15"

];



/* =====================================
   캔버스 크기
===================================== */

function resizeCanvas() {


    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    confettiCanvas.width =
        window.innerWidth *
        ratio;


    confettiCanvas.height =
        window.innerHeight *
        ratio;


    confettiCanvas.style.width =
        window.innerWidth +
        "px";


    confettiCanvas.style.height =
        window.innerHeight +
        "px";


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

}


window.addEventListener(
    "resize",
    resizeCanvas
);


resizeCanvas();



/* =====================================
   아래에서 위로 색종이 발사
===================================== */

function launchConfetti(
    amount = 180
) {


    const centerX =
        window.innerWidth /
        2;


    const startY =
        window.innerHeight +
        10;


    for (
        let i = 0;
        i < amount;
        i++
    ) {


        confettiPieces.push({


            x:
                centerX +
                (
                    Math.random() -
                    .5
                ) *
                120,


            y:
                startY,


            vx:
                (
                    Math.random() -
                    .5
                ) *
                13,


            vy:
                -(
                    Math.random() *
                    10 +
                    16
                ),


            gravity:
                Math.random() *
                .12 +
                .28,


            rotation:
                Math.random() *
                Math.PI *
                2,


            rotationSpeed:
                (
                    Math.random() -
                    .5
                ) *
                .3,


            width:
                Math.random() *
                9 +
                5,


            height:
                Math.random() *
                7 +
                4,


            color:
                confettiColors[
                    Math.floor(
                        Math.random() *
                        confettiColors.length
                    )
                ],


            wobble:
                Math.random() *
                Math.PI *
                2,


            opacity:
                1


        });

    }


    startConfetti();

}



/* =====================================
   색종이 움직임
===================================== */

function startConfetti() {


    if (
        confettiAnimation
    ) {

        return;

    }


    function animate() {


        ctx.clearRect(
            0,
            0,
            window.innerWidth,
            window.innerHeight
        );


        confettiPieces =
            confettiPieces.filter(
                piece =>

                    piece.y <
                    window.innerHeight +
                    100

                    &&

                    piece.opacity >
                    0
            );


        confettiPieces.forEach(
            piece => {


                piece.wobble +=
                    .07;


                piece.x +=

                    piece.vx

                    +

                    Math.sin(
                        piece.wobble
                    ) *
                    .7;


                piece.y +=
                    piece.vy;


                /*
                중력 적용

                위로 올라간 뒤
                다시 아래로 떨어짐
                */

                piece.vy +=
                    piece.gravity;


                piece.rotation +=
                    piece.rotationSpeed;


                /*
                아래쪽으로 내려오면
                자연스럽게 사라짐
                */

                if (

                    piece.y >
                    window.innerHeight *
                    .82

                    &&

                    piece.vy >
                    0

                ) {


                    piece.opacity -=
                        .025;


                }


                ctx.save();


                ctx.globalAlpha =
                    Math.max(
                        piece.opacity,
                        0
                    );


                ctx.translate(
                    piece.x,
                    piece.y
                );


                ctx.rotate(
                    piece.rotation
                );


                ctx.fillStyle =
                    piece.color;


                ctx.fillRect(

                    -piece.width / 2,

                    -piece.height / 2,

                    piece.width,

                    piece.height

                );


                ctx.restore();


            }
        );


        if (
            confettiPieces.length >
            0
        ) {


            confettiAnimation =
                requestAnimationFrame(
                    animate
                );


        }

        else {


            ctx.clearRect(
                0,
                0,
                window.innerWidth,
                window.innerHeight
            );


            confettiAnimation =
                null;


        }

    }


    confettiAnimation =
        requestAnimationFrame(
            animate
        );

}



/* =====================================
   게임 시작
===================================== */

createGame();

</script>
