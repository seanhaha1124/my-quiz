<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>나의 성향 테스트</title>

<style>

/* =========================================
   기본 설정
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    padding: 35px 20px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Noto Sans KR",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 10% 20%,
            #ffe7ef 0,
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 80%,
            #e8e7ff 0,
            transparent 30%
        ),
        #f7f8fc;

    color: #222;
}


/* =========================================
   전체
========================================= */

.wrap {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
}


/* =========================================
   메인으로
========================================= */

.home-btn {
    display: inline-flex;
    align-items: center;

    margin-bottom: 25px;
    padding: 9px 14px;

    background: #fff;

    border: 1px solid #e2e8f0;
    border-radius: 30px;

    color: #64748b;

    text-decoration: none;

    font-size: 14px;
    font-weight: 700;

    transition: .2s;
}

.home-btn:hover {
    background: #fff1f5;
    border-color: #fbcfe8;
    color: #db2777;

    transform: translateX(-2px);
}


/* =========================================
   상단 제목
========================================= */

.header {
    text-align: center;
    margin-bottom: 28px;
}

.main-icon {
    width: 72px;
    height: 72px;

    margin: 0 auto 16px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 22px;

    background: #ffe7ef;

    font-size: 36px;
}

h1 {
    margin-bottom: 10px;

    font-size: 36px;
    letter-spacing: -1.5px;
}

.header p {
    color: #777;

    font-size: 15px;
    line-height: 1.7;
}


/* =========================================
   테스트 박스
========================================= */

.test-box {
    padding: 32px;

    background: rgba(255,255,255,.96);

    border: 1px solid #e8e8ef;
    border-radius: 26px;

    box-shadow:
        0 18px 50px
        rgba(0,0,0,.06);
}


/* =========================================
   시작 화면
========================================= */

.start-screen {
    padding: 15px 5px 5px;

    text-align: center;
}

.start-emoji {
    margin-bottom: 15px;

    font-size: 70px;
}

.start-screen h2 {
    margin-bottom: 13px;

    font-size: 27px;
}

.start-description {
    margin-bottom: 28px;

    color: #64748b;

    font-size: 15px;
    line-height: 1.8;
}

.start-info {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin-bottom: 28px;
}

.start-info-box {
    padding: 15px 7px;

    background: #fdf2f8;

    border-radius: 14px;
}

.start-info-icon {
    display: block;

    margin-bottom: 5px;

    font-size: 22px;
}

.start-info-text {
    color: #64748b;

    font-size: 12px;
    font-weight: 700;
}


/* =========================================
   메인 버튼
========================================= */

.main-button {
    width: 100%;
    min-height: 54px;

    border: 0;
    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #ec4899,
            #8b5cf6
        );

    color: white;

    font-family: inherit;

    font-size: 16px;
    font-weight: 800;

    cursor: pointer;

    transition: .2s;
}

.main-button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 20px
        rgba(236,72,153,.20);
}


/* =========================================
   질문 화면
========================================= */

.question-screen {
    display: none;
}

.progress-info {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 10px;
}

.question-number {
    color: #db2777;

    font-size: 13px;
    font-weight: 800;
}

.progress-percent {
    color: #94a3b8;

    font-size: 12px;
    font-weight: 700;
}

.progress {
    width: 100%;
    height: 9px;

    margin-bottom: 35px;

    background: #f1f5f9;

    border-radius: 20px;

    overflow: hidden;
}

.progress-bar {
    width: 10%;
    height: 100%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #ec4899,
            #8b5cf6
        );

    transition: width .35s ease;
}

.question-icon {
    margin-bottom: 12px;

    text-align: center;

    font-size: 42px;
}

.question {
    min-height: 80px;

    margin-bottom: 25px;

    display: flex;

    justify-content: center;
    align-items: center;

    text-align: center;

    font-size: 23px;
    font-weight: 800;

    line-height: 1.5;

    word-break: keep-all;
}


/* =========================================
   선택지
========================================= */

.answers {
    display: grid;
    gap: 12px;
}

.answer-btn {
    position: relative;

    width: 100%;
    min-height: 78px;

    padding:
        16px 50px 16px 20px;

    border: 2px solid #eef2f7;
    border-radius: 16px;

    background: #fff;

    color: #475569;

    font-family: inherit;

    font-size: 15px;
    font-weight: 700;

    line-height: 1.55;

    text-align: left;

    cursor: pointer;

    transition: .2s;
}

.answer-btn::after {
    content: "→";

    position: absolute;

    right: 20px;
    top: 50%;

    transform: translateY(-50%);

    color: #cbd5e1;

    font-size: 20px;

    transition: .2s;
}

.answer-btn:hover {
    border-color: #f9a8d4;

    background: #fdf2f8;

    color: #be185d;

    transform: translateY(-2px);
}

.answer-btn:hover::after {
    right: 16px;

    color: #ec4899;
}


/* =========================================
   이전 버튼
========================================= */

.question-bottom {
    margin-top: 20px;

    text-align: center;
}

.prev-btn {
    border: 0;

    background: transparent;

    color: #94a3b8;

    font-family: inherit;

    font-size: 13px;
    font-weight: 700;

    cursor: pointer;
}

.prev-btn:hover {
    color: #64748b;
}

.prev-btn:disabled {
    opacity: 0;

    pointer-events: none;
}


/* =========================================
   결과
========================================= */

.result-screen {
    display: none;

    text-align: center;
}

.result-small {
    margin-bottom: 7px;

    color: #94a3b8;

    font-size: 13px;
    font-weight: 700;
}

.result-icon {
    margin: 5px 0 12px;

    font-size: 78px;
}

.result-title {
    margin-bottom: 6px;

    font-size: 14px;

    color: #db2777;

    font-weight: 800;
}

.result-name {
    margin-bottom: 15px;

    font-size: 31px;
    font-weight: 900;

    letter-spacing: -1px;
}

.result-description {
    max-width: 560px;

    margin: 0 auto 25px;

    color: #64748b;

    font-size: 15px;

    line-height: 1.8;

    word-break: keep-all;
}


/* =========================================
   특징
========================================= */

.traits {
    margin-bottom: 25px;

    padding: 20px;

    background: #fdf2f8;

    border-radius: 18px;

    text-align: left;
}

.traits-title {
    margin-bottom: 13px;

    color: #be185d;

    font-size: 14px;
    font-weight: 800;
}

.trait-list {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;
}

.trait {
    padding: 8px 12px;

    background: white;

    border: 1px solid #fbcfe8;
    border-radius: 30px;

    color: #64748b;

    font-size: 12px;
    font-weight: 700;
}


/* =========================================
   점수
========================================= */

.score-area {
    margin-bottom: 22px;

    padding: 20px;

    border: 1px solid #eef2f7;
    border-radius: 18px;

    text-align: left;
}

.score-title {
    margin-bottom: 15px;

    font-size: 14px;
    font-weight: 800;

    color: #475569;
}

.score-row {
    display: grid;

    grid-template-columns:
        72px 1fr 30px;

    gap: 10px;

    align-items: center;

    margin-bottom: 11px;
}

.score-row:last-child {
    margin-bottom: 0;
}

.score-name {
    color: #64748b;

    font-size: 12px;
    font-weight: 700;
}

.score-track {
    height: 8px;

    background: #f1f5f9;

    border-radius: 20px;

    overflow: hidden;
}

.score-fill {
    width: 0;
    height: 100%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #f472b6,
            #8b5cf6
        );

    transition: width .8s ease;
}

.score-value {
    color: #94a3b8;

    font-size: 11px;
    font-weight: 800;

    text-align: right;
}


/* =========================================
   공유 영역
========================================= */

.share-area {
    margin-bottom: 22px;

    padding: 20px;

    background:
        linear-gradient(
            135deg,
            #fff1f5,
            #f5f3ff
        );

    border-radius: 18px;
}

.share-title {
    margin-bottom: 6px;

    color: #475569;

    font-size: 15px;
    font-weight: 900;
}

.share-description {
    margin-bottom: 15px;

    color: #94a3b8;

    font-size: 12px;

    line-height: 1.6;
}

.share-buttons {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;
}

.share-btn,
.copy-btn {
    min-height: 48px;

    border-radius: 13px;

    font-family: inherit;

    font-size: 13px;
    font-weight: 800;

    cursor: pointer;

    transition: .2s;
}

.share-btn {
    border: 0;

    background: #ec4899;

    color: white;
}

.share-btn:hover {
    background: #db2777;

    transform: translateY(-1px);
}

.copy-btn {
    border: 2px solid #e9d5ff;

    background: white;

    color: #7c3aed;
}

.copy-btn:hover {
    background: #faf5ff;
}


/* 복사 완료 메시지 */

.copy-message {
    display: none;

    margin-top: 12px;

    color: #16a34a;

    font-size: 12px;
    font-weight: 800;
}


/* =========================================
   하단 버튼
========================================= */

.result-buttons {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;
}

.retry-btn,
.result-home-btn {
    min-height: 52px;

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius: 14px;

    font-family: inherit;

    font-size: 14px;
    font-weight: 800;
}

.retry-btn {
    border: 0;

    background:
        linear-gradient(
            135deg,
            #ec4899,
            #8b5cf6
        );

    color: white;

    cursor: pointer;
}

.result-home-btn {
    border: 2px solid #e2e8f0;

    background: #f8fafc;

    color: #475569;

    text-decoration: none;
}


/* =========================================
   애니메이션
========================================= */

.fade-in {
    animation: fadeIn .35s ease;
}

@keyframes fadeIn {

    from {
        opacity: 0;

        transform: translateY(8px);
    }

    to {
        opacity: 1;

        transform: translateY(0);
    }

}


/* =========================================
   모바일
========================================= */

@media(max-width:600px) {

    body {
        padding: 25px 14px;
    }

    h1 {
        font-size: 29px;
    }

    .test-box {
        padding: 24px 17px;

        border-radius: 21px;
    }

    .question {
        min-height: 70px;

        font-size: 20px;
    }

    .answer-btn {
        min-height: 72px;

        padding:
            14px 45px 14px 16px;

        font-size: 14px;
    }

    .start-info {
        gap: 6px;
    }

    .start-info-box {
        padding: 13px 4px;
    }

    .result-name {
        font-size: 27px;
    }

    .share-buttons,
    .result-buttons {
        grid-template-columns: 1fr;
    }

}

</style>
</head>


<body>

/* =========================================
   변수
========================================= */

let currentQuestion = 0;

let selectedAnswers = [];

let currentResultType = null;


/* =========================================
   요소
========================================= */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const questionScreen =
    document.getElementById(
        "questionScreen"
    );

const resultScreen =
    document.getElementById(
        "resultScreen"
    );

const questionNumber =
    document.getElementById(
        "questionNumber"
    );

const progressPercent =
    document.getElementById(
        "progressPercent"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );

const questionIcon =
    document.getElementById(
        "questionIcon"
    );

const questionText =
    document.getElementById(
        "questionText"
    );

const answersEl =
    document.getElementById(
        "answers"
    );

const prevBtn =
    document.getElementById(
        "prevBtn"
    );

const copyMessage =
    document.getElementById(
        "copyMessage"
    );


/* =========================================
   테스트 시작
========================================= */

document
    .getElementById(
        "startBtn"
    )
    .addEventListener(
        "click",
        startTest
    );


function startTest() {

    currentQuestion = 0;

    selectedAnswers = [];

    currentResultType = null;


    startScreen.style.display =
        "none";

    resultScreen.style.display =
        "none";

    questionScreen.style.display =
        "block";


    showQuestion();

}


/* =========================================
   질문 표시
========================================= */

function showQuestion() {

    const data =
        questions[
            currentQuestion
        ];


    const progress =
        Math.round(
            (
                (currentQuestion + 1)
                /
                questions.length
            )
            *
            100
        );


    questionNumber.textContent =
        `QUESTION ${currentQuestion + 1} / ${questions.length}`;


    progressPercent.textContent =
        `${progress}%`;


    progressBar.style.width =
        `${progress}%`;


    questionIcon.textContent =
        data.icon;


    questionText.textContent =
        data.question;


    answersEl.innerHTML =
        "";


    data.answers.forEach(
        answer => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "answer-btn";


            button.textContent =
                answer.text;


            button.addEventListener(
                "click",
                () => {

                    selectAnswer(
                        answer.type
                    );

                }
            );


            answersEl.appendChild(
                button
            );

        }
    );


    prevBtn.disabled =
        currentQuestion === 0;


    questionScreen.classList.remove(
        "fade-in"
    );


    void questionScreen.offsetWidth;


    questionScreen.classList.add(
        "fade-in"
    );

}


/* =========================================
   답 선택
========================================= */

function selectAnswer(type) {

    selectedAnswers[
        currentQuestion
    ] = type;


    if (
        currentQuestion <
        questions.length - 1
    ) {

        currentQuestion++;

        showQuestion();

    }

    else {

        showResult();

    }

}


/* =========================================
   이전 문제
========================================= */

prevBtn.addEventListener(
    "click",
    () => {

        if (
            currentQuestion <= 0
        ) {
            return;
        }


        currentQuestion--;


        selectedAnswers =
            selectedAnswers.slice(
                0,
                currentQuestion
            );


        showQuestion();

    }
);


/* =========================================
   점수 계산
========================================= */

function calculateScores() {

    const scores = {

        explorer: 0,

        planner: 0,

        creator: 0,

        harmony: 0

    };


    selectedAnswers.forEach(
        type => {

            if (
                scores[type]
                !== undefined
            ) {

                scores[type]++;

            }

        }
    );


    return scores;

}


/* =========================================
   결과 유형 찾기
========================================= */

function findResultType(scores) {

    const keys =
        Object.keys(
            scores
        );


    const highest =
        Math.max(
            ...Object.values(
                scores
            )
        );


    const winners =
        keys.filter(
            key =>
                scores[key] ===
                highest
        );


    if (
        winners.length === 1
    ) {

        return winners[0];

    }


    /*
    동점일 경우
    가장 최근에 선택한
    동점 유형을 결과로 사용
    */

    for (
        let i =
            selectedAnswers.length - 1;

        i >= 0;

        i--
    ) {

        if (
            winners.includes(
                selectedAnswers[i]
            )
        ) {

            return selectedAnswers[i];

        }

    }


    return winners[0];

}


/* =========================================
   결과 표시
========================================= */

function showResult() {

    const scores =
        calculateScores();


    currentResultType =
        findResultType(
            scores
        );


    const result =
        types[
            currentResultType
        ];


    questionScreen.style.display =
        "none";


    resultScreen.style.display =
        "block";


    resultScreen.classList.remove(
        "fade-in"
    );


    void resultScreen.offsetWidth;


    resultScreen.classList.add(
        "fade-in"
    );


    document
        .getElementById(
            "resultIcon"
        )
        .textContent =
            result.icon;


    document
        .getElementById(
            "resultTitle"
        )
        .textContent =
            result.title;


    document
        .getElementById(
            "resultName"
        )
        .textContent =
            result.name;


    document
        .getElementById(
            "resultDescription"
        )
        .textContent =
            result.description;


    renderTraits(
        result.traits
    );


    renderScores(
        scores
    );


    copyMessage.style.display =
        "none";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =========================================
   특징 표시
========================================= */

function renderTraits(traits) {

    const traitList =
        document.getElementById(
            "traitList"
        );


    traitList.innerHTML =
        "";


    traits.forEach(
        trait => {

            const span =
                document.createElement(
                    "span"
                );


            span.className =
                "trait";


            span.textContent =
                `# ${trait}`;


            traitList.appendChild(
                span
            );

        }
    );

}


/* =========================================
   점수 표시
========================================= */

function renderScores(scores) {

    const scoreList =
        document.getElementById(
            "scoreList"
        );


    scoreList.innerHTML =
        "";


    const labels = {

        explorer:
            "모험가",

        planner:
            "계획가",

        creator:
            "크리에이터",

        harmony:
            "공감가"

    };


    /*
    가장 높은 점수를 기준으로
    그래프 길이를 표시

    예:
    최고점이 4점이면
    4점 = 100%
    2점 = 50%
    */

    const maxScore =
        Math.max(
            ...Object.values(
                scores
            ),
            1
        );


    Object.keys(
        scores
    )
    .forEach(
        key => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "score-row";


            const width =
                (
                    scores[key]
                    /
                    maxScore
                )
                *
                100;


            row.innerHTML = `

                <div class="score-name">
                    ${labels[key]}
                </div>

                <div class="score-track">

                    <div
                        class="score-fill"
                        data-width="${width}"
                    ></div>

                </div>

                <div class="score-value">
                    ${scores[key]}
                </div>

            `;


            scoreList.appendChild(
                row
            );

        }
    );


    setTimeout(
        () => {

            document
                .querySelectorAll(
                    ".score-fill"
                )
                .forEach(
                    bar => {

                        bar.style.width =
                            bar.dataset.width
                            +
                            "%";

                    }
                );

        },
        100
    );

}


/* =========================================
   공유할 URL 만들기
========================================= */

function getShareUrl() {

    /*
    현재 페이지 주소에서
    기존 ?result= 부분을 제거한 뒤
    새로운 결과를 넣는다.
    */

    const url =
        new URL(
            window.location.href
        );


    url.searchParams.set(
        "result",
        currentResultType
    );


    return url.toString();

}


/* =========================================
   공유 문구 만들기
========================================= */

function getShareText() {

    const result =
        types[
            currentResultType
        ];


    return (
        "💗 나의 성향 테스트 결과\n\n"
        +
        result.icon
        +
        " "
        +
        result.name
        +
        "\n\n"
        +
        result.title
        +
        " 스타일이 나왔어요!\n\n"
        +
        "당신의 성향도 테스트해보세요."
    );

}


/* =========================================
   결과 공유하기
========================================= */

document
    .getElementById(
        "shareBtn"
    )
    .addEventListener(
        "click",
        shareResult
    );


async function shareResult() {

    if (!currentResultType) {
        return;
    }


    const result =
        types[
            currentResultType
        ];


    const shareData = {

        title:
            `나의 성향은 ${result.name}`,

        text:
            getShareText(),

        url:
            getShareUrl()

    };


    /*
    아이폰 / 안드로이드 등
    Web Share API를 지원하면
    기본 공유창 열기
    */

    if (
        navigator.share
    ) {

        try {

            await navigator.share(
                shareData
            );

        }

        catch (error) {

            /*
            사용자가 공유창을
            그냥 닫은 경우에는
            아무것도 하지 않음
            */

            if (
                error.name !==
                "AbortError"
            ) {

                copyShareContent();

            }

        }

    }

    else {

        /*
        기본 공유 기능을
        지원하지 않는 PC 브라우저
        */

        copyShareContent();

    }

}


/* =========================================
   링크 복사
========================================= */

document
    .getElementById(
        "copyBtn"
    )
    .addEventListener(
        "click",
        copyLink
    );


async function copyLink() {

    const url =
        getShareUrl();


    try {

        await navigator.clipboard.writeText(
            url
        );


        showCopyMessage(
            "✓ 테스트 링크가 복사되었습니다!"
        );

    }

    catch (error) {

        fallbackCopy(
            url
        );

    }

}


/* =========================================
   결과 + 링크 전체 복사
========================================= */

async function copyShareContent() {

    const content =
        getShareText()
        +
        "\n\n"
        +
        getShareUrl();


    try {

        await navigator.clipboard.writeText(
            content
        );


        showCopyMessage(
            "✓ 결과와 링크가 복사되었습니다!"
        );

    }

    catch (error) {

        fallbackCopy(
            content
        );

    }

}


/* =========================================
   구형 브라우저 복사
========================================= */

function fallbackCopy(text) {

    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.value =
        text;


    textarea.style.position =
        "fixed";


    textarea.style.left =
        "-9999px";


    document.body.appendChild(
        textarea
    );


    textarea.focus();

    textarea.select();


    try {

        document.execCommand(
            "copy"
        );


        showCopyMessage(
            "✓ 복사되었습니다!"
        );

    }

    catch (error) {

        alert(
            "복사하지 못했습니다. 주소창의 링크를 직접 복사해주세요."
        );

    }


    textarea.remove();

}


/* =========================================
   복사 완료 표시
========================================= */

function showCopyMessage(message) {

    copyMessage.textContent =
        message;


    copyMessage.style.display =
        "block";


    clearTimeout(
        showCopyMessage.timer
    );


    showCopyMessage.timer =
        setTimeout(
            () => {

                copyMessage.style.display =
                    "none";

            },
            2500
        );

}


/* =========================================
   공유받은 링크 처리
========================================= */

function checkSharedResult() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const sharedResult =
        params.get(
            "result"
        );


    /*
    공유 링크에
    올바른 결과값이 들어있다면
    시작 화면에 안내 표시
    */

    if (
        sharedResult
        &&
        types[
            sharedResult
        ]
    ) {

        const result =
            types[
                sharedResult
            ];


        const notice =
            document.createElement(
                "div"
            );


        notice.style.marginBottom =
            "22px";


        notice.style.padding =
            "16px";


        notice.style.background =
            "#fdf2f8";


        notice.style.borderRadius =
            "15px";


        notice.style.color =
            "#be185d";


        notice.style.fontSize =
            "14px";


        notice.style.fontWeight =
            "700";


        notice.style.lineHeight =
            "1.7";


        notice.innerHTML =
            `
            친구의 결과는<br>
            <strong style="
                font-size:18px;
                color:#831843;
            ">
                ${result.icon}
                ${result.name}
            </strong>
            <br>
            나의 결과도 확인해보세요!
            `;


        const startDescription =
            document.querySelector(
                ".start-description"
            );


        startDescription.insertAdjacentElement(
            "afterend",
            notice
        );

    }

}


/* =========================================
   다시 테스트
========================================= */

document
    .getElementById(
        "retryBtn"
    )
    .addEventListener(
        "click",
        () => {

            currentQuestion =
                0;


            selectedAnswers =
                [];


            currentResultType =
                null;


            resultScreen.style.display =
                "none";


            startScreen.style.display =
                "block";


            copyMessage.style.display =
                "none";


            /*
            주소에 붙은
            result 파라미터 제거
            */

            const url =
                new URL(
                    window.location.href
                );


            url.searchParams.delete(
                "result"
            );


            window.history.replaceState(
                {},
                "",
                url.pathname
            );


            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        }
    );


/* =========================================
   페이지 처음 열릴 때
========================================= */

checkSharedResult();
