<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>나의 성향 테스트</title>

<style>

/* =========================================
   기본 설정
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    min-height: 100vh;

    padding: 35px 20px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Noto Sans KR",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 10% 20%,
            #ffe7ef 0,
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 80%,
            #e8e7ff 0,
            transparent 30%
        ),
        #f7f8fc;

    color: #222;

}


/* =========================================
   전체
========================================= */

.wrap {

    width: 100%;
    max-width: 720px;

    margin: 0 auto;

}


/* =========================================
   메인으로
========================================= */

.home-btn {

    display: inline-flex;

    align-items: center;

    margin-bottom: 25px;

    padding: 9px 14px;

    background: #fff;

    border: 1px solid #e2e8f0;

    border-radius: 30px;

    color: #64748b;

    text-decoration: none;

    font-size: 14px;
    font-weight: 700;

    transition: .2s;

}


.home-btn:hover {

    background: #fff1f5;

    border-color: #fbcfe8;

    color: #db2777;

    transform:
        translateX(-2px);

}


/* =========================================
   상단 제목
========================================= */

.header {

    text-align: center;

    margin-bottom: 28px;

}


.main-icon {

    width: 72px;
    height: 72px;

    margin:
        0 auto 16px;

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius: 22px;

    background: #ffe7ef;

    font-size: 36px;

}


h1 {

    margin-bottom: 10px;

    font-size: 36px;

    letter-spacing: -1.5px;

}


.header p {

    color: #777;

    font-size: 15px;

    line-height: 1.7;

}


/* =========================================
   테스트 박스
========================================= */

.test-box {

    padding: 32px;

    background:
        rgba(255,255,255,.96);

    border:
        1px solid #e8e8ef;

    border-radius: 26px;

    box-shadow:
        0 18px 50px
        rgba(0,0,0,.06);

}


/* =========================================
   시작 화면
========================================= */

.start-screen {

    padding:
        15px 5px 5px;

    text-align: center;

}


.start-emoji {

    margin-bottom: 15px;

    font-size: 70px;

}


.start-screen h2 {

    margin-bottom: 13px;

    font-size: 27px;

}


.start-description {

    margin-bottom: 28px;

    color: #64748b;

    font-size: 15px;

    line-height: 1.8;

}


.start-info {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin-bottom: 28px;

}


.start-info-box {

    padding:
        15px 7px;

    background: #fdf2f8;

    border-radius: 14px;

}


.start-info-icon {

    display: block;

    margin-bottom: 5px;

    font-size: 22px;

}


.start-info-text {

    color: #64748b;

    font-size: 12px;

    font-weight: 700;

}


/* =========================================
   공통 버튼
========================================= */

.main-button {

    width: 100%;

    min-height: 54px;

    border: 0;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #ec4899,
            #8b5cf6
        );

    color: white;

    font-family: inherit;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;

    transition: .2s;

}


.main-button:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 20px
        rgba(236,72,153,.20);

}


/* =========================================
   질문 화면
========================================= */

.question-screen {

    display: none;

}


/* 진행 정보 */

.progress-info {

    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 10px;

}


.question-number {

    color: #db2777;

    font-size: 13px;

    font-weight: 800;

}


.progress-percent {

    color: #94a3b8;

    font-size: 12px;

    font-weight: 700;

}


/* 진행바 */

.progress {

    width: 100%;
    height: 9px;

    margin-bottom: 35px;

    background: #f1f5f9;

    border-radius: 20px;

    overflow: hidden;

}


.progress-bar {

    width: 10%;
    height: 100%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #ec4899,
            #8b5cf6
        );

    transition:
        width .35s ease;

}


/* 질문 */

.question-icon {

    margin-bottom: 12px;

    text-align: center;

    font-size: 42px;

}


.question {

    min-height: 80px;

    margin-bottom: 25px;

    display: flex;

    justify-content: center;
    align-items: center;

    text-align: center;

    font-size: 23px;

    font-weight: 800;

    line-height: 1.5;

    word-break: keep-all;

}


/* =========================================
   선택지
========================================= */

.answers {

    display: grid;

    gap: 12px;

}


.answer-btn {

    position: relative;

    width: 100%;

    min-height: 78px;

    padding:
        16px 50px 16px 20px;

    border:
        2px solid #eef2f7;

    border-radius: 16px;

    background: #fff;

    color: #475569;

    font-family: inherit;

    font-size: 15px;

    font-weight: 700;

    line-height: 1.55;

    text-align: left;

    cursor: pointer;

    transition: .2s;

}


.answer-btn::after {

    content: "→";

    position: absolute;

    right: 20px;
    top: 50%;

    transform:
        translateY(-50%);

    color: #cbd5e1;

    font-size: 20px;

    transition: .2s;

}


.answer-btn:hover {

    border-color: #f9a8d4;

    background: #fdf2f8;

    color: #be185d;

    transform:
        translateY(-2px);

}


.answer-btn:hover::after {

    right: 16px;

    color: #ec4899;

}


/* =========================================
   이전 버튼
========================================= */

.question-bottom {

    margin-top: 20px;

    text-align: center;

}


.prev-btn {

    border: 0;

    background: transparent;

    color: #94a3b8;

    font-family: inherit;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;

}


.prev-btn:hover {

    color: #64748b;

}


.prev-btn:disabled {

    opacity: 0;

    pointer-events: none;

}


/* =========================================
   결과 화면
========================================= */

.result-screen {

    display: none;

    text-align: center;

}


.result-small {

    margin-bottom: 7px;

    color: #94a3b8;

    font-size: 13px;

    font-weight: 700;

}


.result-icon {

    margin:
        5px 0 12px;

    font-size: 78px;

}


.result-title {

    margin-bottom: 6px;

    font-size: 14px;

    color: #db2777;

    font-weight: 800;

}


.result-name {

    margin-bottom: 15px;

    font-size: 31px;

    font-weight: 900;

    letter-spacing: -1px;

}


.result-description {

    max-width: 560px;

    margin:
        0 auto 25px;

    color: #64748b;

    font-size: 15px;

    line-height: 1.8;

    word-break: keep-all;

}


/* =========================================
   특징
========================================= */

.traits {

    margin-bottom: 25px;

    padding: 20px;

    background: #fdf2f8;

    border-radius: 18px;

    text-align: left;

}


.traits-title {

    margin-bottom: 13px;

    color: #be185d;

    font-size: 14px;

    font-weight: 800;

}


.trait-list {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

}


.trait {

    padding:
        8px 12px;

    background: white;

    border:
        1px solid #fbcfe8;

    border-radius: 30px;

    color: #64748b;

    font-size: 12px;

    font-weight: 700;

}


/* =========================================
   결과 점수
========================================= */

.score-area {

    margin-bottom: 27px;

    padding: 20px;

    border:
        1px solid #eef2f7;

    border-radius: 18px;

    text-align: left;

}


.score-title {

    margin-bottom: 15px;

    font-size: 14px;

    font-weight: 800;

    color: #475569;

}


.score-row {

    display: grid;

    grid-template-columns:
        72px 1fr 30px;

    gap: 10px;

    align-items: center;

    margin-bottom: 11px;

}


.score-row:last-child {

    margin-bottom: 0;

}


.score-name {

    color: #64748b;

    font-size: 12px;

    font-weight: 700;

}


.score-track {

    height: 8px;

    background: #f1f5f9;

    border-radius: 20px;

    overflow: hidden;

}


.score-fill {

    width: 0;

    height: 100%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #f472b6,
            #8b5cf6
        );

    transition:
        width .8s ease;

}


.score-value {

    color: #94a3b8;

    font-size: 11px;

    font-weight: 800;

    text-align: right;

}


/* =========================================
   결과 버튼
========================================= */

.result-buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

}


.retry-btn,
.result-home-btn {

    min-height: 52px;

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius: 14px;

    font-family: inherit;

    font-size: 14px;

    font-weight: 800;

}


.retry-btn {

    border: 0;

    background:
        linear-gradient(
            135deg,
            #ec4899,
            #8b5cf6
        );

    color: white;

    cursor: pointer;

}


.result-home-btn {

    border:
        2px solid #e2e8f0;

    background: #f8fafc;

    color: #475569;

    text-decoration: none;

}


/* =========================================
   전환 효과
========================================= */

.fade-in {

    animation:
        fadeIn .35s ease;

}


@keyframes fadeIn {

    from {

        opacity: 0;

        transform:
            translateY(8px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================================
   모바일
========================================= */

@media(max-width:600px) {

    body {

        padding:
            25px 14px;

    }


    h1 {

        font-size: 29px;

    }


    .test-box {

        padding:
            24px 17px;

        border-radius: 21px;

    }


    .question {

        min-height: 70px;

        font-size: 20px;

    }


    .answer-btn {

        min-height: 72px;

        padding:
            14px 45px 14px 16px;

        font-size: 14px;

    }


    .start-info {

        gap: 6px;

    }


    .start-info-box {

        padding:
            13px 4px;

    }


    .result-name {

        font-size: 27px;

    }


    .result-buttons {

        grid-template-columns: 1fr;

    }

}

</style>
</head>


<body>


<main class="wrap">


    <!-- =====================================

    <a

    <!-- =====================================

<script>

/* =========================================

/* =========================================
   변수
========================================= */

let currentQuestion = 0;


/*
사용자가 고른 답을 저장한다.

예:
[
 "explorer",
 "creator",
 ...
]
*/

let selectedAnswers = [];



/* =========================================
   HTML 요소
========================================= */

const startScreen =
    document.getElementById(
        "startScreen"
    );


const questionScreen =
    document.getElementById(
        "questionScreen"
    );


const resultScreen =
    document.getElementById(
        "resultScreen"
    );


const questionNumber =
    document.getElementById(
        "questionNumber"
    );


const progressPercent =
    document.getElementById(
        "progressPercent"
    );


const progressBar =
    document.getElementById(
        "progressBar"
    );


const questionIcon =
    document.getElementById(
        "questionIcon"
    );


const questionText =
    document.getElementById(
        "questionText"
    );


const answersEl =
    document.getElementById(
        "answers"
    );


const prevBtn =
    document.getElementById(
        "prevBtn"
    );



/* =========================================
   테스트 시작
========================================= */

document
    .getElementById(
        "startBtn"
    )
    .addEventListener(
        "click",
        startTest
    );


function startTest() {


    currentQuestion = 0;

    selectedAnswers = [];


    startScreen.style.display =
        "none";


    resultScreen.style.display =
        "none";


    questionScreen.style.display =
        "block";


    questionScreen.classList.add(
        "fade-in"
    );


    showQuestion();

}



/* =========================================
   질문 표시
========================================= */

function showQuestion() {


    const data =
        questions[
            currentQuestion
        ];


    /*
    진행률
    */

    const progress =
        Math.round(
            (
                (
                    currentQuestion +
                    1
                )
                /
                questions.length
            )
            *
            100
        );


    questionNumber.textContent =
        `QUESTION ${currentQuestion + 1} / ${questions.length}`;


    progressPercent.textContent =
        `${progress}%`;


    progressBar.style.width =
        `${progress}%`;


    /*
    질문 내용
    */

    questionIcon.textContent =
        data.icon;


    questionText.textContent =
        data.question;


    /*
    기존 선택지 제거
    */

    answersEl.innerHTML =
        "";


    /*
    선택지 생성
    */

    data.answers.forEach(
        answer => {


            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "answer-btn";


            button.textContent =
                answer.text;


            button.addEventListener(
                "click",
                () => {

                    selectAnswer(
                        answer.type
                    );

                }
            );


            answersEl.appendChild(
                button
            );

        }
    );


    /*
    첫 번째 문제에서는
    이전 버튼 숨김
    */

    prevBtn.disabled =
        currentQuestion === 0;


    /*
    질문 등장 효과
    */

    questionScreen.classList.remove(
        "fade-in"
    );


    void questionScreen.offsetWidth;


    questionScreen.classList.add(
        "fade-in"
    );

}



/* =========================================
   답 선택
========================================= */

function selectAnswer(type) {


    /*
    현재 문제의 답 저장
    */

    selectedAnswers[
        currentQuestion
    ] = type;


    /*
    마지막 질문인지 확인
    */

    if (
        currentQuestion <
        questions.length - 1
    ) {


        currentQuestion++;


        showQuestion();

    }

    else {


        showResult();

    }

}



/* =========================================
   이전 문제
========================================= */

prevBtn.addEventListener(
    "click",
    () => {


        if (
            currentQuestion <= 0
        ) {

            return;

        }


        /*
        현재 질문 답은
        아직 선택하지 않았으므로
        이전 문제로 이동
        */

        currentQuestion--;


        /*
        이전에 선택했던 답부터
        다시 선택하게 하기 위해 삭제
        */

        selectedAnswers =
            selectedAnswers.slice(
                0,
                currentQuestion
            );


        showQuestion();

    }
);



/* =========================================
   점수 계산
========================================= */

function calculateScores() {


    const scores = {

        explorer: 0,

        planner: 0,

        creator: 0,

        harmony: 0

    };


    selectedAnswers.forEach(
        type => {


            if (
                scores[
                    type
                ] !== undefined
            ) {


                scores[
                    type
                ]++;


            }

        }
    );


    return scores;

}



/* =========================================
   최고 점수 찾기
========================================= */

function findResultType(scores) {


    const keys =
        Object.keys(
            scores
        );


    let highest =
        Math.max(
            ...Object.values(
                scores
            )
        );


    /*
    동점 유형 찾기
    */

    const winners =
        keys.filter(
            key =>
                scores[key] ===
                highest
        );


    /*
    하나만 최고점이면
    그대로 반환
    */

    if (
        winners.length === 1
    ) {

        return winners[0];

    }


    /*
    동점일 경우

    사용자가 뒤쪽 질문에서
    더 최근에 선택한 성향을
    결과로 사용

    랜덤 결과가 아니기 때문에
    같은 답을 선택하면
    같은 결과가 나온다.
    */

    for (
        let i =
            selectedAnswers.length - 1;

        i >= 0;

        i--
    ) {


        if (
            winners.includes(
                selectedAnswers[i]
            )
        ) {


            return selectedAnswers[i];

        }

    }


    return winners[0];

}



/* =========================================
   결과 표시
========================================= */

function showResult() {


    const scores =
        calculateScores();


    const resultType =
        findResultType(
            scores
        );


    const result =
        types[
            resultType
        ];


    questionScreen.style.display =
        "none";


    resultScreen.style.display =
        "block";


    resultScreen.classList.remove(
        "fade-in"
    );


    void resultScreen.offsetWidth;


    resultScreen.classList.add(
        "fade-in"
    );


    /*
    결과 내용
    */

    document
        .getElementById(
            "resultIcon"
        )
        .textContent =
            result.icon;


    document
        .getElementById(
            "resultTitle"
        )
        .textContent =
            result.title;


    document
        .getElementById(
            "resultName"
        )
        .textContent =
            result.name;


    document
        .getElementById(
            "resultDescription"
        )
        .textContent =
            result.description;



    /*
    특징
    */

    const traitList =
        document.getElementById(
            "traitList"
        );


    traitList.innerHTML =
        "";


    result.traits.forEach(
        trait => {


            const span =
                document.createElement(
                    "span"
                );


            span.className =
                "trait";


            span.textContent =
                `# ${trait}`;


            traitList.appendChild(
                span
            );

        }
    );



    /*
    점수 그래프
    */

    renderScores(
        scores
    );


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}



/* =========================================
   점수 그래프
========================================= */

function renderScores(scores) {


    const scoreList =
        document.getElementById(
            "scoreList"
        );


    scoreList.innerHTML =
        "";


    const labels = {

        explorer:
            "모험가",

        planner:
            "계획가",

        creator:
            "크리에이터",

        harmony:
            "공감가"

    };


    Object.keys(
        scores
    )
    .forEach(
        key => {


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "score-row";


            /*
            질문 10개 중
            받은 점수를 백분율처럼
            그래프 길이로 표현
            */

            const width =
                (
                    scores[key]
                    /
                    questions.length
                )
                *
                100;


            row.innerHTML = `

                <div class="score-name">
                    ${labels[key]}
                </div>

                <div class="score-track">

                    <div
                        class="score-fill"
                        data-width="${width}"
                    >
                    </div>

                </div>

                <div class="score-value">
                    ${scores[key]}
                </div>

            `;


            scoreList.appendChild(
                row
            );

        }
    );


    /*
    그래프가 자연스럽게
    늘어나는 효과
    */

    setTimeout(
        () => {


            document
                .querySelectorAll(
                    ".score-fill"
                )
                .forEach(
                    bar => {


                        bar.style.width =
                            bar.dataset.width +
                            "%";


                    }
                );


        },
        100
    );

}



/* =========================================
   다시 테스트
========================================= */

document
    .getElementById(
        "retryBtn"
    )
    .addEventListener(
        "click",
        () => {


            currentQuestion =
                0;


            selectedAnswers =
                [];


            resultScreen.style.display =
                "none";


            startScreen.style.display =
                "block";


            startScreen.classList.remove(
                "fade-in"
            );


            void startScreen.offsetWidth;


            startScreen.classList.add(
                "fade-in"
            );


            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        }
    );

</script>
