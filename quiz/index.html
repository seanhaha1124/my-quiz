<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>상식 퀴즈</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;

    font-family: -apple-system, BlinkMacSystemFont,
        "Pretendard", "Noto Sans KR", Arial, sans-serif;

    background:
        radial-gradient(circle at 15% 20%, #dbeafe 0, transparent 35%),
        radial-gradient(circle at 85% 80%, #ede9fe 0, transparent 35%),
        #f8fafc;

    color: #1e293b;
    overflow-x: hidden;
}


/* =========================
   퀴즈 박스
========================= */

.quiz-container {
    width: 100%;
    max-width: 650px;
    background: rgba(255,255,255,0.95);
    border-radius: 28px;
    padding: 38px;
    box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);

    position: relative;
    z-index: 2;
}


/* =========================
   메인으로 버튼
========================= */

.home-top {
    display: inline-flex;
    align-items: center;
    gap: 5px;

    margin-bottom: 22px;
    padding: 9px 14px;

    border: 1px solid #e2e8f0;
    border-radius: 30px;

    background: #ffffff;
    color: #64748b;

    font-size: 14px;
    font-weight: 700;

    text-decoration: none;

    transition: 0.2s;
}

.home-top:hover {
    background: #f5f3ff;
    border-color: #c7d2fe;
    color: #4f46e5;
    transform: translateX(-2px);
}


/* =========================
   제목
========================= */

.quiz-title {
    text-align: center;
    margin-top: 0;
    margin-bottom: 8px;
    font-size: 32px;
}

.quiz-subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 32px;
}


/* =========================
   상단 정보
========================= */

.top-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 14px;
    color: #64748b;
}


/* =========================
   진행바
========================= */

.progress {
    width: 100%;
    height: 9px;
    background: #e2e8f0;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 30px;
}

.progress-bar {
    height: 100%;
    width: 0;

    background: linear-gradient(
        90deg,
        #6366f1,
        #8b5cf6
    );

    transition: width 0.35s ease;
}


/* =========================
   문제
========================= */

.question-number {
    color: #6366f1;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 8px;
}

.question {
    font-size: 24px;
    line-height: 1.5;
    font-weight: 700;
    margin-bottom: 24px;
}


/* =========================
   답변
========================= */

.answers {
    display: grid;
    gap: 12px;
}

.answer-btn {
    width: 100%;
    min-height: 58px;

    border: 2px solid #e2e8f0;
    border-radius: 15px;

    background: white;

    padding: 15px 18px;

    font-size: 16px;
    text-align: left;
    color: #334155;

    cursor: pointer;

    transition: 0.2s;
}

.answer-btn:hover:not(:disabled) {
    border-color: #818cf8;
    background: #f5f3ff;
    transform: translateY(-1px);
}

.answer-btn:disabled {
    cursor: default;
}

.answer-btn.correct {
    background: #ecfdf5;
    border-color: #22c55e;
    color: #166534;
    font-weight: 700;
}

.answer-btn.wrong {
    background: #fef2f2;
    border-color: #ef4444;
    color: #991b1b;
}


/* =========================
   정답 설명
========================= */

.feedback {
    display: none;

    margin-top: 22px;
    padding: 18px;

    border-radius: 15px;

    line-height: 1.65;
}

.feedback.correct {
    display: block;
    background: #ecfdf5;
    color: #166534;
}

.feedback.wrong {
    display: block;
    background: #fef2f2;
    color: #991b1b;
}

.feedback.correct strong {
    display: inline-block;
    animation: correctPop 0.45s ease;
}

@keyframes correctPop {

    0% {
        transform: scale(0.7);
    }

    60% {
        transform: scale(1.18);
    }

    100% {
        transform: scale(1);
    }

}


/* =========================
   다음 버튼
========================= */

.next-btn {
    display: none;

    width: 100%;
    margin-top: 20px;

    border: 0;
    border-radius: 15px;

    padding: 16px;

    background: #4f46e5;
    color: white;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;
}

.next-btn:hover {
    background: #4338ca;
}


/* =========================
   결과 화면
========================= */

.result {
    display: none;
    text-align: center;
}

.result-icon {
    font-size: 70px;
    margin-bottom: 10px;
}

.result h2 {
    font-size: 30px;
    margin: 10px 0;
}

.score-big {
    font-size: 58px;
    font-weight: 800;
    color: #4f46e5;
    margin: 20px 0 10px;
}

.result-message {
    color: #64748b;
    line-height: 1.7;
    margin-bottom: 30px;
}

.result-buttons {
    display: grid;
    gap: 12px;
}

.restart-btn,
.home-btn {
    width: 100%;

    border: 0;
    border-radius: 15px;

    padding: 16px;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;

    text-decoration: none;

    text-align: center;

    transition: 0.2s;
}

.restart-btn {
    background: #4f46e5;
    color: white;
}

.restart-btn:hover {
    background: #4338ca;
}

.home-btn {
    display: block;

    background: #f1f5f9;
    color: #334155;

    border: 2px solid #e2e8f0;
}

.home-btn:hover {
    background: #e2e8f0;
}


/* =========================
   색종이 캔버스
========================= */

#confettiCanvas {
    position: fixed;
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 9999;
}


/* =========================
   모바일
========================= */

@media (max-width: 600px) {

    body {
        padding: 15px;
        align-items: flex-start;
        padding-top: 25px;
    }

    .quiz-container {
        padding: 22px 20px 25px;
        border-radius: 22px;
    }

    .home-top {
        margin-bottom: 18px;
    }

    .quiz-title {
        font-size: 27px;
    }

    .question {
        font-size: 20px;
    }

    .answer-btn {
        font-size: 15px;
    }

}
</style>
</head>


<body>

<canvas id="confettiCanvas"></canvas>


<div class="quiz-container">


    <!-- =========================
         퀴즈 화면
    ========================== -->

    <div id="quizScreen">


        <a href="../" class="home-top">
            ← 메인으로
        </a>


        <h1 class="quiz-title">
            🧠 상식 퀴즈
        </h1>


        <p class="quiz-subtitle">
            나는 과연 몇 문제를 맞힐 수 있을까요?
        </p>


        <div class="top-info">

            <span id="progressText">
                1 / 5
            </span>

            <span>
                점수
                <strong id="score">
                    0
                </strong>
            </span>

        </div>


        <div class="progress">

            <div
                class="progress-bar"
                id="progressBar">
            </div>

        </div>


        <div
            class="question-number"
            id="questionNumber">
        </div>


        <div
            class="question"
            id="question">
        </div>


        <div
            class="answers"
            id="answers">
        </div>


        <div
            class="feedback"
            id="feedback">
        </div>


        <button
            class="next-btn"
            id="nextBtn">

            다음 문제 →

        </button>


    </div>



    <!-- =========================
         결과 화면
    ========================== -->

    <div
        class="result"
        id="resultScreen">


        <div
            class="result-icon"
            id="resultIcon">

            🎉

        </div>


        <h2>
            퀴즈 완료!
        </h2>


        <div
            class="score-big"
            id="finalScore">
        </div>


        <div
            class="result-message"
            id="resultMessage">
        </div>


        <div class="result-buttons">


            <button
                class="restart-btn"
                id="restartBtn">

                🔄 다시 도전하기

            </button>


            <a
                href="../"
                class="home-btn">

                🏠 메인으로 가기

            </a>


        </div>


    </div>


</div>



<script>

/* ========================================
   퀴즈 데이터
======================================== */

const quizData = [

    {
        question:
            "대한민국의 수도는 어디일까요?",

        answers: [
            "부산",
            "서울",
            "인천",
            "대전"
        ],

        correct: 1,

        explanation:
            "대한민국의 수도는 서울입니다. 서울은 대한민국의 정치·경제·문화 중심지입니다."
    },


    {
        question:
            "세계에서 가장 큰 대양은 무엇일까요?",

        answers: [
            "대서양",
            "인도양",
            "태평양",
            "북극해"
        ],

        correct: 2,

        explanation:
            "태평양은 지구에서 가장 넓고 깊은 대양입니다."
    },


    {
        question:
            "식물이 햇빛을 이용해 양분을 만드는 과정을 무엇이라고 할까요?",

        answers: [
            "호흡",
            "증발",
            "발효",
            "광합성"
        ],

        correct: 3,

        explanation:
            "식물은 햇빛 에너지를 이용하는 광합성을 통해 유기물을 만듭니다."
    },


    {
        question:
            "훈민정음 창제를 주도한 조선의 왕은 누구일까요?",

        answers: [
            "태조",
            "세종",
            "영조",
            "정조"
        ],

        correct: 1,

        explanation:
            "세종대왕은 백성이 쉽게 글을 익힐 수 있도록 훈민정음 창제를 주도했습니다."
    },


    {
        question:
            "지구가 태양을 한 바퀴 도는 데 걸리는 시간은 약 얼마일까요?",

        answers: [
            "24시간",
            "30일",
            "365일",
            "10년"
        ],

        correct: 2,

        explanation:
            "지구의 공전 주기는 약 365.24일입니다. 이를 기준으로 1년을 정합니다."
    }

];



/* ========================================
   기본 변수
======================================== */

let currentQuestion = 0;
let score = 0;
let answered = false;


const questionEl =
    document.getElementById("question");

const questionNumberEl =
    document.getElementById("questionNumber");

const answersEl =
    document.getElementById("answers");

const feedbackEl =
    document.getElementById("feedback");

const nextBtn =
    document.getElementById("nextBtn");

const scoreEl =
    document.getElementById("score");

const progressText =
    document.getElementById("progressText");

const progressBar =
    document.getElementById("progressBar");

const quizScreen =
    document.getElementById("quizScreen");

const resultScreen =
    document.getElementById("resultScreen");



/* ========================================
   문제 불러오기
======================================== */

function loadQuestion() {

    answered = false;

    const data =
        quizData[currentQuestion];


    questionNumberEl.textContent =
        `QUESTION ${currentQuestion + 1}`;


    questionEl.textContent =
        data.question;


    progressText.textContent =
        `${currentQuestion + 1} / ${quizData.length}`;


    progressBar.style.width =
        `${((currentQuestion + 1) / quizData.length) * 100}%`;


    answersEl.innerHTML = "";


    feedbackEl.style.display =
        "none";

    feedbackEl.className =
        "feedback";


    nextBtn.style.display =
        "none";


    data.answers.forEach(
        (answer, index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer-btn";


            button.textContent =
                `${index + 1}. ${answer}`;


            button.addEventListener(
                "click",
                () =>
                    selectAnswer(
                        index,
                        button
                    )
            );


            answersEl.appendChild(
                button
            );

        }
    );

}



/* ========================================
   답 선택
======================================== */

function selectAnswer(
    index,
    selectedButton
) {

    if (answered) return;

    answered = true;


    const data =
        quizData[currentQuestion];


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    buttons.forEach(
        button =>
            button.disabled = true
    );


    /* 정답 */

    if (
        index ===
        data.correct
    ) {

        score++;

        scoreEl.textContent =
            score;


        selectedButton
            .classList
            .add("correct");


        feedbackEl.className =
            "feedback correct";


        feedbackEl.innerHTML =
            `<strong>🎉 정답입니다!</strong><br>${data.explanation}`;


        /*
        아래에서 위로 팡!
        */

        launchConfetti();

    }


    /* 오답 */

    else {

        selectedButton
            .classList
            .add("wrong");


        buttons[data.correct]
            .classList
            .add("correct");


        feedbackEl.className =
            "feedback wrong";


        feedbackEl.innerHTML =
            `<strong>아쉽네요!</strong><br>${data.explanation}`;

    }


    feedbackEl.style.display =
        "block";


    nextBtn.style.display =
        "block";


    if (
        currentQuestion ===
        quizData.length - 1
    ) {

        nextBtn.textContent =
            "결과 보기 →";

    }

    else {

        nextBtn.textContent =
            "다음 문제 →";

    }

}



/* ========================================
   다음 문제
======================================== */

nextBtn.addEventListener(
    "click",
    () => {

        currentQuestion++;


        if (
            currentQuestion <
            quizData.length
        ) {

            loadQuestion();

        }

        else {

            showResult();

        }

    }
);



/* ========================================
   결과
======================================== */

function showResult() {

    quizScreen.style.display =
        "none";


    resultScreen.style.display =
        "block";


    const percentage =
        Math.round(
            (
                score /
                quizData.length
            ) * 100
        );


    document.getElementById(
        "finalScore"
    ).textContent =
        `${percentage}점`;


    const icon =
        document.getElementById(
            "resultIcon"
        );


    const message =
        document.getElementById(
            "resultMessage"
        );


    if (
        percentage === 100
    ) {

        icon.textContent =
            "🏆";


        message.innerHTML =
            `전 문제 정답!<br>
            대단해요. 당신은 상식 퀴즈왕입니다!`;


        /* 만점이면 더 크게 */

        setTimeout(
            () =>
                launchConfetti(260),
            200
        );

    }


    else if (
        percentage >= 80
    ) {

        icon.textContent =
            "🎉";


        message.innerHTML =
            `아주 훌륭해요!<br>
            ${quizData.length}문제 중 ${score}문제를 맞혔습니다.`;

    }


    else if (
        percentage >= 60
    ) {

        icon.textContent =
            "👏";


        message.innerHTML =
            `좋아요! 조금만 더 도전해볼까요?<br>
            ${quizData.length}문제 중 ${score}문제를 맞혔습니다.`;

    }


    else {

        icon.textContent =
            "💪";


        message.innerHTML =
            `괜찮아요! 다시 도전하면 더 잘할 수 있어요.<br>
            ${quizData.length}문제 중 ${score}문제를 맞혔습니다.`;

    }

}



/* ========================================
   다시 도전
======================================== */

document.getElementById(
    "restartBtn"
).addEventListener(
    "click",
    () => {

        currentQuestion = 0;
        score = 0;


        scoreEl.textContent =
            0;


        resultScreen.style.display =
            "none";


        quizScreen.style.display =
            "block";


        loadQuestion();

    }
);



/* ========================================
   🎊 색종이 효과
   아래 → 위 → 아래
======================================== */

const confettiCanvas =
    document.getElementById(
        "confettiCanvas"
    );


const ctx =
    confettiCanvas.getContext(
        "2d"
    );


let confettiPieces = [];
let confettiAnimation = null;


const confettiColors = [

    "#6366f1",
    "#8b5cf6",
    "#ec4899",
    "#f43f5e",
    "#f59e0b",
    "#22c55e",
    "#06b6d4",
    "#3b82f6",
    "#facc15",
    "#fb7185"

];



/* ========================================
   캔버스 크기
======================================== */

function resizeConfettiCanvas() {

    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    confettiCanvas.width =
        window.innerWidth * ratio;


    confettiCanvas.height =
        window.innerHeight * ratio;


    confettiCanvas.style.width =
        window.innerWidth + "px";


    confettiCanvas.style.height =
        window.innerHeight + "px";


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

}


window.addEventListener(
    "resize",
    resizeConfettiCanvas
);


resizeConfettiCanvas();



/* ========================================
   색종이 발사
======================================== */

function launchConfetti(
    amount = 150
) {

    /*
    화면 아래쪽 중앙에서
    양쪽으로 퍼지면서 위로 발사
    */

    const centerX =
        window.innerWidth / 2;


    const startY =
        window.innerHeight + 10;


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        /*
        좌우 방향
        */

        const horizontalSpeed =
            (Math.random() - 0.5) * 13;


        /*
        위로 강하게 발사
        음수 = 위쪽
        */

        const verticalSpeed =
            -(Math.random() * 10 + 16);


        confettiPieces.push({

            x:
                centerX +
                (Math.random() - 0.5) * 100,

            y:
                startY,

            vx:
                horizontalSpeed,

            vy:
                verticalSpeed,

            /*
            중력 때문에
            올라갔다 다시 내려옴
            */

            gravity:
                Math.random() * 0.12 + 0.28,

            drag:
                0.995,

            rotation:
                Math.random() *
                Math.PI * 2,

            rotationSpeed:
                (Math.random() - 0.5) *
                0.32,

            width:
                Math.random() * 9 + 5,

            height:
                Math.random() * 7 + 4,

            color:
                confettiColors[
                    Math.floor(
                        Math.random() *
                        confettiColors.length
                    )
                ],

            wobble:
                Math.random() *
                Math.PI * 2,

            wobbleSpeed:
                Math.random() *
                0.1 + 0.04,

            opacity: 1

        });

    }


    startConfettiAnimation();

}



/* ========================================
   색종이 움직이기
======================================== */

function startConfettiAnimation() {

    if (confettiAnimation) {
        return;
    }


    function animate() {

        ctx.clearRect(
            0,
            0,
            window.innerWidth,
            window.innerHeight
        );


        confettiPieces =
            confettiPieces.filter(

                piece =>

                    piece.y <
                        window.innerHeight + 100 &&

                    piece.opacity > 0

            );


        confettiPieces.forEach(
            piece => {

                /*
                흔들림
                */

                piece.wobble +=
                    piece.wobbleSpeed;


                /*
                이동
                */

                piece.x +=
                    piece.vx +
                    Math.sin(
                        piece.wobble
                    ) * 0.7;


                piece.y +=
                    piece.vy;


                /*
                중력

                처음에는 위로 올라가다가
                속도가 0이 된 후
                다시 아래로 떨어짐
                */

                piece.vy +=
                    piece.gravity;


                piece.vx *=
                    piece.drag;


                /*
                회전
                */

                piece.rotation +=
                    piece.rotationSpeed;


                /*
                화면 아래쪽으로
                떨어질 때 살짝 사라짐
                */

                if (
                    piece.y >
                    window.innerHeight * 0.82
                    &&
                    piece.vy > 0
                ) {

                    piece.opacity -=
                        0.025;

                }


                /*
                그리기
                */

                ctx.save();


                ctx.globalAlpha =
                    Math.max(
                        piece.opacity,
                        0
                    );


                ctx.translate(
                    piece.x,
                    piece.y
                );


                ctx.rotate(
                    piece.rotation
                );


                ctx.fillStyle =
                    piece.color;


                ctx.fillRect(

                    -piece.width / 2,

                    -piece.height / 2,

                    piece.width,

                    piece.height

                );


                ctx.restore();

            }
        );


        if (
            confettiPieces.length > 0
        ) {

            confettiAnimation =
                requestAnimationFrame(
                    animate
                );

        }

        else {

            ctx.clearRect(
                0,
                0,
                window.innerWidth,
                window.innerHeight
            );


            confettiAnimation =
                null;

        }

    }


    confettiAnimation =
        requestAnimationFrame(
            animate
        );

}



/* ========================================
   시작
======================================== */

loadQuestion();

</script>

</body>
</html>
